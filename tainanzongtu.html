<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的攝影視界｜策展式一頁網站</title>
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/6/w3.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      /* 換成你的背景圖片網址 */
      background-image: url('https://lh3.googleusercontent.com/pw/AP1GczOBy8iLjS9pAGd49AMSbYwOgXYa9TFEY_zmqGnOA0pSymVtW0sf1CGu0iFnf_n3Q-urfZWu0x1KYxBCRY1A6E0uxOuUusW8xrWirR4lTUSTq5XdRAZ8VTR8Ol1F31MIwsRNM-x5jDD-f1tJyu5mvV9g1g=w1215-h911-s-no-gm?authuser=0');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
    }

    /* 背景微暗遮罩，讓主副標題與照片更有質感 */
    .page-overlay {
      min-height: 100vh;
      background: rgba(15, 18, 22, 0.58);
      padding: 56px 24px 80px;
      overflow-x: hidden; /* 避免大字體超出螢幕產生橫向捲軸 */
    }

    .content-wrapper {
      max-width: 960px;
      margin: 0 auto;
    }

    /* 主標題與副標題 */
    .hero-header {
      text-align: center;
      color: #ffffff;
      padding: 44px 24px;
      margin-bottom: 72px;
      background: rgba(0, 0, 0, 0.38);
      border-radius: 12px;
      backdrop-filter: blur(4px);
    }

    .hero-header h1 {
      margin: 0 0 12px;
      font-size: 2.6rem;
      letter-spacing: 3px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    }

    .hero-header p {
      margin: 0;
      font-size: 1.15rem;
      color: #eaeaea;
      letter-spacing: 1px;
    }

    /* 垂直單欄＋左右交錯容器 */
    .staggered-gallery {
      display: flex;
      flex-direction: column;
      gap: 80px;
    }

    /* 照片外框：設定 relative 作為文字定位基準，並拿掉白底 */
    .photo-card {
      position: relative;
      width: 65%;
      background: transparent;
      transition: transform 0.3s ease;
    }

    .photo-card:hover {
      transform: translateY(-5px);
    }

    /* 奇數張靠左、偶數張靠右 */
    .photo-card:nth-child(odd) {
      align-self: flex-start;
    }

    .photo-card:nth-child(even) {
      align-self: flex-end;
    }

    /* 圖片本體：z-index 設為 2，蓋在文字上方 */
    .photo-card img {
      position: relative;
      z-index: 2;
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45);
    }

    /* 兩字大標題標註：z-index 設為 1，自然被圖片遮住一小部分 */
    .side-tag {
      position: absolute;
      z-index: 1;
      bottom: 0;
      transform: none;
      font-size: 8rem; /* 大字體，可依需求調成 4.5rem ~ 7rem */
      font-weight: 900; /* 最粗體 */
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 6px;
      line-height: 1.1;
      user-select: none;
      pointer-events: none;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      white-space: nowrap;
    }

    /* 圖片靠左（奇數）時，文字放右側，並往左伸進圖片底下 32px */
    .photo-card:nth-child(odd) .side-tag {
      left: calc(100% - 16px);
    }

    /* 圖片靠右（偶數）時，文字放左側，並往右伸進圖片底下 32px */
    .photo-card:nth-child(even) .side-tag {
      right: calc(100% - 16px);
    }

    /* 手機版螢幕較窄時的自適應調整 */
    @media (max-width: 700px) {
      .photo-card {
        width: 85%;
      }
      .side-tag {
        font-size: 3.2rem;
        top: auto;
        bottom: -22px;
        transform: none;
      }
      .photo-card:nth-child(odd) .side-tag {
        left: auto;
        right: 8px;
      }
      .photo-card:nth-child(even) .side-tag {
        right: auto;
        left: 8px;
      }
      .staggered-gallery {
        gap: 60px;
      }
    }
  </style>
</head>
