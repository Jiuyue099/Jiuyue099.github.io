<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日常生活擬音 Web Audio DAW 音樂編輯器</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖標 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            950: '#08090c',
                            900: '#0f1117',
                            850: '#161922',
                            800: '#1e2230',
                            700: '#2a3045',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        /* 隱藏滾動條但保持滾動功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 黑膠唱片旋轉動畫 */
        @keyframes vinyl-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-vinyl {
            animation: vinyl-spin 4s linear infinite;
        }
        .animate-vinyl-paused {
            animation-play-state: paused;
        }

        /* 唱臂擺動過渡動畫 */
        .tonearm {
            transform-origin: 20px 20px;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tonearm-playing {
            transform: rotate(22deg);
        }

        /* 高亮網格發光發散效果 */
        .step-active {
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
        }
    </style>
</head>
<body class="bg-dark-950 text-slate-100 font-sans h-screen flex flex-col overflow-hidden select-none">

    <!-- 頂部主導航區 (Top Header & Global Controls) -->
    <header class="h-14 border-b border-slate-800/80 bg-dark-900/90 px-4 flex items-center justify-between z-30 flex-shrink-0">
        <!-- Logo 與軟體資訊 -->
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-pink-500 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                <i class="fa-solid fa-compact-disc text-white text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm tracking-wide text-white flex items-center gap-2">
                    生活聲景 DAW 音樂編輯器
                    <span class="text-[10px] bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 px-1.5 py-0.5 rounded font-mono">獨立網頁版</span>
                </h1>
                <p class="text-[10px] text-slate-400">12 軌日常生活擬音 + 視覺圖片聲景生成</p>
            </div>
        </div>

        <!-- 全域播放控制區 (Global Playback Controls) -->
        <div class="flex items-center gap-4">
            <!-- 播放 / 暫停 / 停止 -->
            <div class="flex items-center bg-dark-850 p-1 rounded-lg border border-slate-800">
                <button id="btn-play" class="w-10 h-8 rounded-md bg-cyan-500 hover:bg-cyan-400 text-dark-950 font-bold flex items-center justify-center transition-all shadow-md shadow-cyan-500/20">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button id="btn-stop" class="w-10 h-8 rounded-md hover:bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center transition-all">
                    <i class="fa-solid fa-stop"></i>
                </button>
            </div>

            <!-- BPM 速度控制器 -->
            <div class="flex items-center gap-2 bg-dark-850 px-3 py-1.5 rounded-lg border border-slate-800">
                <span class="text-xs font-mono font-bold text-slate-400">BPM</span>
                <input id="input-bpm" type="number" min="40" max="220" value="110" class="w-12 bg-transparent text-sm font-bold font-mono text-cyan-400 focus:outline-none text-center">
            </div>

            <!-- 調性音階選擇器 -->
            <div class="flex items-center gap-2 bg-dark-850 px-3 py-1.5 rounded-lg border border-slate-800">
                <i class="fa-solid fa-music text-xs text-pink-400"></i>
                <select id="select-scale" class="bg-transparent text-xs font-bold text-slate-200 focus:outline-none cursor-pointer">
                    <option value="pentatonic" class="bg-dark-900">五聲音階 (Pentatonic)</option>
                    <option value="major" class="bg-dark-900">自然大調 (Major)</option>
                    <option value="minor" class="bg-dark-900">自然小調 (Minor)</option>
                    <option value="blues" class="bg-dark-900">藍調調式 (Blues)</option>
                    <option value="japanese" class="bg-dark-900">昭和和風 (Japanese)</option>
                    <option value="dreamcore" class="bg-dark-900">夢核全音 (Dreamcore)</option>
                    <option value="locrian" class="bg-dark-900">懸疑恐怖 (Locrian)</option>
                </select>
            </div>
        </div>

        <!-- 工具按鈕區 (隨機與圖片 AI) -->
        <div class="flex items-center gap-2">
            <button id="btn-random-all" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold flex items-center gap-1.5 border border-slate-700 transition-all">
                <i class="fa-solid fa-dice text-cyan-400"></i> 隨機生成
            </button>
            <button id="btn-open-photo-modal" class="px-3 py-1.5 rounded-lg bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-400 hover:to-purple-500 text-white text-xs font-bold flex items-center gap-1.5 shadow-lg shadow-pink-500/20 transition-all">
                <i class="fa-solid fa-image"></i> 圖片配樂
            </button>
        </div>
    </header>

    <!-- 主編輯區域：左控制欄 + 中間滑動網格 + 右側黑膠盤 -->
    <div class="flex-1 flex overflow-hidden relative">
        
        <!-- 動態背景圖片容器 -->
        <div id="bg-canvas-container" class="absolute inset-0 z-0 opacity-10 pointer-events-none transition-all duration-700 bg-cover bg-center filter blur-xl"></div>

        <!-- 左側固定：樂器控制區 (Track Headers) -->
        <div id="track-headers-container" class="w-56 flex-shrink-0 bg-dark-900/95 border-r border-slate-800/80 flex flex-col z-20 shadow-xl py-2 px-3 space-y-2 overflow-y-auto">
            <div class="h-8 border-b border-slate-800/80 flex items-center justify-between text-[11px] font-bold text-slate-400 uppercase tracking-wider px-1 flex-shrink-0">
                <span><i class="fa-solid fa-sliders text-cyan-400 mr-1"></i> 生活音效樂器</span>
                <span class="text-[10px] text-slate-500">M / S</span>
            </div>
            <!-- 樂器卡片由 JS 動態生成 -->
        </div>

        <!-- 中間：統一滑動網格 (Ruler + Tracks Matrix) -->
        <div class="flex-1 overflow-x-auto overflow-y-auto z-10 flex flex-col bg-dark-950/60 relative" id="timeline-scroll-container">
            
            <!-- 頂部時間軸刻度列 (Ruler) -->
            <div id="timeline-ruler" class="h-8 border-b border-slate-800/80 flex items-center flex-shrink-0 sticky top-0 bg-dark-900/95 z-20 min-w-max">
                <!-- 由 JS 生成 64 步數字刻度 -->
            </div>

            <!-- 64 步音符矩陣 (Track Grids) -->
            <div id="tracks-grid-container" class="flex-1 flex flex-col py-2 space-y-2 min-w-max relative">
                <!-- 動態貫穿播放線 (Playhead Bar) -->
                <div id="playhead-line" class="absolute top-0 bottom-0 w-0.5 bg-gradient-to-b from-cyan-400 via-pink-500 to-cyan-400 z-30 pointer-events-none transition-all duration-75 shadow-[0_0_8px_#00f3ff]" style="left: 0px;"></div>
                <!-- 音軌列由 JS 動態生成 -->
            </div>
        </div>

        <!-- 右側固定：黑膠唱片播放面板 -->
        <div class="w-64 flex-shrink-0 bg-dark-900/95 border-l border-slate-800 flex flex-col items-center justify-between z-20 shadow-2xl p-4 relative overflow-hidden">
            
            <div class="w-full text-center border-b border-slate-800 pb-2">
                <span class="text-xs font-bold text-slate-400 tracking-wider uppercase"><i class="fa-solid fa-compact-disc text-pink-400 mr-1"></i> 黑膠聲景唱盤</span>
            </div>

            <!-- 黑膠唱片與唱臂區 -->
            <div class="relative w-48 h-48 my-auto flex items-center justify-center">
                <!-- 黑膠唱片盤 -->
                <div id="vinyl-record" class="w-44 h-44 rounded-full bg-gradient-to-tr from-neutral-900 via-black to-neutral-800 border-4 border-neutral-800 shadow-2xl flex items-center justify-center animate-vinyl animate-vinyl-paused relative">
                    <!-- 黑膠溝紋線條 -->
                    <div class="absolute inset-2 rounded-full border border-neutral-700/30"></div>
                    <div class="absolute inset-5 rounded-full border border-neutral-700/20"></div>
                    <div class="absolute inset-8 rounded-full border border-neutral-700/30"></div>
                    <div class="absolute inset-11 rounded-full border border-neutral-700/20"></div>
                    
                    <!-- 中央唱片貼紙封面 -->
                    <div id="vinyl-cover" class="w-16 h-16 rounded-full bg-slate-800 border-2 border-slate-700 bg-cover bg-center flex items-center justify-center shadow-inner relative overflow-hidden">
                        <i class="fa-solid fa-music text-slate-500 text-lg"></i>
                    </div>
                    <!-- 唱片中心軸孔 -->
                    <div class="w-3 h-3 rounded-full bg-dark-950 border border-slate-600 absolute z-10"></div>
                </div>

                <!-- 唱臂 Tonearm -->
                <div class="absolute -top-3 -right-2 w-20 h-28 pointer-events-none z-20">
                    <svg id="tonearm-svg" class="w-full h-full tonearm" viewBox="0 0 80 100">
                        <!-- 基座 -->
                        <circle cx="20" cy="20" r="10" fill="#334155" stroke="#475569" stroke-width="2"/>
                        <circle cx="20" cy="20" r="4" fill="#94a3b8"/>
                        <!-- 唱臂金屬桿 -->
                        <path d="M 20 20 L 35 55 L 28 82" fill="none" stroke="#cbd5e1" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <!-- 唱頭 -->
                        <rect x="20" y="80" width="14" height="12" rx="2" fill="#ec4899" transform="rotate(-15 27 86)"/>
                    </svg>
                </div>
            </div>

            <!-- 狀態提示區 -->
            <div class="w-full bg-dark-850 rounded-lg p-2.5 border border-slate-800 text-center">
                <div id="vinyl-status" class="text-[10px] text-slate-500 font-mono">PAUSED</div>
                <div class="text-[11px] text-slate-300 font-bold truncate mt-0.5">即時聲學模擬發聲</div>
            </div>
        </div>

    </div>

    <!-- 圖片 AI 配樂彈出視窗 (Modal) -->
    <div id="photo-modal" class="fixed inset-0 bg-dark-950/80 backdrop-blur-md z-50 flex items-center justify-center hidden">
        <div class="bg-dark-900 border border-slate-800 rounded-2xl w-[480px] p-6 shadow-2xl relative">
            <button id="btn-close-modal" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h2 class="text-base font-bold text-white mb-1 flex items-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles text-pink-500"></i> 圖片配樂分析生成
            </h2>
            <p class="text-xs text-slate-400 mb-4">上傳照片，系統將自動提取色彩氛圍並編排專屬生活聲景樂曲。</p>

            <div id="drop-area" class="border-2 border-dashed border-slate-700 hover:border-cyan-400 rounded-xl p-6 text-center cursor-pointer transition-all bg-dark-850/50">
                <i class="fa-solid fa-cloud-arrow-up text-3xl text-cyan-400 mb-2"></i>
                <p class="text-xs font-bold text-slate-200">點擊上傳或拖放照片至此區域</p>
                <p class="text-[10px] text-slate-500 mt-1">支援 JPG, PNG, WEBP 圖片格式</p>
                <input type="file" id="photo-input" accept="image/*" class="hidden">
            </div>

            <div id="photo-preview-container" class="mt-4 flex items-center gap-3 hidden">
                <img id="photo-preview" class="w-14 h-14 rounded-lg object-cover border border-slate-700" alt="預覽圖">
                <div class="overflow-hidden">
                    <p id="photo-filename" class="text-xs font-bold text-slate-200 truncate"></p>
                    <span class="text-[10px] text-cyan-400">已成功載入圖片</span>
                </div>
            </div>

            <button id="btn-analyze-generate" class="w-full mt-5 py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-pink-500 hover:from-cyan-400 hover:to-pink-400 text-dark-950 font-bold text-xs shadow-lg shadow-cyan-500/20 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-play"></i> 開始分析並生成專屬配樂
            </button>
        </div>
    </div>

    <!-- JS 主程式邏輯 -->
    <script>
        // 日常生活樂器音效配置 (12 軌擬音音效)
        const TRACK_CONFIGS = [
            { id: 'glass', name: '🍸 玻璃碰撞', color: '#00f3ff', pitchIdx: 7 },
            { id: 'door', name: '🚪 關門重音', color: '#ff007f', pitchIdx: 0 },
            { id: 'key', name: '🔑 鑰匙叮噹', color: '#9d00ff', pitchIdx: 6 },
            { id: 'footstep', name: '👠 鞋跟腳步', color: '#00ff88', pitchIdx: 1 },
            { id: 'water', name: '💧 滴水清響', color: '#38bdf8', pitchIdx: 5 },
            { id: 'flush', name: '🚽 馬桶沖水', color: '#f59e0b', pitchIdx: 2 },
            { id: 'clap', name: '👏 拍手擊掌', color: '#ec4899', pitchIdx: 3 },
            { id: 'doorbell', name: '🔔 雙音門鈴', color: '#a855f7', pitchIdx: 4 },
            { id: 'paper', name: '📄 紙張撕裂', color: '#e2e8f0', pitchIdx: 5 },
            { id: 'cork', name: '🍾 軟木塞啵', color: '#f43f5e', pitchIdx: 3 },
            { id: 'coin', name: '🪙 硬幣落地', color: '#fbbf24', pitchIdx: 7 },
            { id: 'keyboard', name: '⌨️ 鍵盤打字', color: '#10b981', pitchIdx: 6 }
        ];

        // 調性音階對照表
        const SCALES = {
            major: [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25, 587.33, 659.25, 698.46, 783.99],
            minor: [261.63, 293.66, 311.13, 349.23, 392.00, 415.30, 466.16, 523.25, 587.33, 622.25, 698.46, 783.99],
            pentatonic: [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66],
            blues: [261.63, 311.13, 349.23, 369.99, 392.00, 466.16, 523.25, 622.25, 698.46, 739.99, 783.99, 932.33],
            japanese: [261.63, 277.18, 349.23, 392.00, 415.30, 523.25, 554.37, 698.46, 783.99, 830.61, 1046.50, 1108.73],
            dreamcore: [261.63, 293.66, 329.63, 369.99, 415.30, 466.16, 523.25, 587.33, 659.25, 739.99, 830.61, 932.33],
            locrian: [261.63, 277.18, 311.13, 349.23, 369.99, 415.30, 466.16, 523.25, 554.37, 622.25, 698.46, 739.99]
        };

        // 全域 DAW 狀態變數
        let currentScale = 'pentatonic';
        let audioCtx = null;
        let bpm = 110;
        let isPlaying = false;
        let currentStep = 0;
        let timerId = null;
        const totalSteps = 64;

        // 12 軌 x 64 步 音符陣列
        let gridData = Array(12).fill(null).map(() => Array(totalSteps).fill(false));
        let trackMutes = Array(12).fill(false);
        let trackSolos = Array(12).fill(false);
        let trackVolumes = Array(12).fill(0.45);

        let uploadedImageBase64 = null;

        // 初始化 AudioContext（響應瀏覽器音訊安全政策）
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Web Audio 原生合成 12 種日常生活擬音
        function playSound(trackIdx) {
            if (!audioCtx) return;
            if (trackMutes[trackIdx]) return;
            
            const anySolo = trackSolos.some(s => s);
            if (anySolo && !trackSolos[trackIdx]) return;

            const now = audioCtx.currentTime;
            const volume = trackVolumes[trackIdx] * 0.45; 
            const cfg = TRACK_CONFIGS[trackIdx];

            const scaleFreqs = SCALES[currentScale] || SCALES.pentatonic;
            const basePitch = scaleFreqs[cfg.pitchIdx];

            const masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(volume, now);
            masterGain.connect(audioCtx.destination);

            switch(cfg.id) {
                case 'glass': // 🍸 玻璃碰撞
                    const oscG = audioCtx.createOscillator();
                    const gainG = audioCtx.createGain();
                    oscG.type = 'sine';
                    oscG.frequency.setValueAtTime(basePitch * 1.6, now);
                    oscG.frequency.exponentialRampToValueAtTime(basePitch * 2.8, now + 0.1);
                    gainG.gain.setValueAtTime(0.8, now);
                    gainG.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                    oscG.connect(gainG);
                    gainG.connect(masterGain);
                    oscG.start(now);
                    oscG.stop(now + 0.5);
                    break;

                case 'door': // 🚪 關門聲
                    const oscD = audioCtx.createOscillator();
                    const gainD = audioCtx.createGain();
                    oscD.type = 'triangle';
                    oscD.frequency.setValueAtTime(basePitch * 0.45, now);
                    oscD.frequency.exponentialRampToValueAtTime(35, now + 0.2);
                    gainD.gain.setValueAtTime(0.9, now);
                    gainD.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    oscD.connect(gainD);
                    gainD.connect(masterGain);
                    oscD.start(now);
                    oscD.stop(now + 0.25);
                    break;

                case 'key': // 🔑 鑰匙叮噹
                    const bufferSizeK = audioCtx.sampleRate * 0.15;
                    const bufferK = audioCtx.createBuffer(1, bufferSizeK, audioCtx.sampleRate);
                    const dataK = bufferK.getChannelData(0);
                    for (let i = 0; i < bufferSizeK; i++) dataK[i] = Math.random() * 2 - 1;
                    const noiseK = audioCtx.createBufferSource();
                    noiseK.buffer = bufferK;
                    const filterK = audioCtx.createBiquadFilter();
                    filterK.type = 'bandpass';
                    filterK.frequency.setValueAtTime(basePitch * 3.6, now);
                    filterK.Q.setValueAtTime(4.5, now);
                    const gainK = audioCtx.createGain();
                    gainK.gain.setValueAtTime(0.8, now);
                    gainK.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
                    noiseK.connect(filterK);
                    filterK.connect(gainK);
                    gainK.connect(masterGain);
                    noiseK.start(now);
                    break;

                case 'footstep': // 👠 鞋跟腳步聲
                    const oscF = audioCtx.createOscillator();
                    const gainF = audioCtx.createGain();
                    oscF.type = 'sine';
                    oscF.frequency.setValueAtTime(basePitch * 0.9, now);
                    oscF.frequency.exponentialRampToValueAtTime(65, now + 0.1);
                    gainF.gain.setValueAtTime(0.8, now);
                    gainF.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                    oscF.connect(gainF);
                    gainF.connect(masterGain);
                    oscF.start(now);
                    oscF.stop(now + 0.12);
                    break;

                case 'water': // 💧 滴水聲
                    const oscW = audioCtx.createOscillator();
                    const gainW = audioCtx.createGain();
                    oscW.type = 'sine';
                    oscW.frequency.setValueAtTime(basePitch * 1.3, now);
                    oscW.frequency.exponentialRampToValueAtTime(basePitch * 3.0, now + 0.08);
                    gainW.gain.setValueAtTime(0.9, now);
                    gainW.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    oscW.connect(gainW);
                    gainW.connect(masterGain);
                    oscW.start(now);
                    oscW.stop(now + 0.2);
                    break;

                case 'flush': // 🚽 馬桶沖水聲
                    const bufLenFl = audioCtx.sampleRate * 0.35;
                    const bufFl = audioCtx.createBuffer(1, bufLenFl, audioCtx.sampleRate);
                    const dFl = bufFl.getChannelData(0);
                    for (let i = 0; i < bufLenFl; i++) dFl[i] = Math.random() * 2 - 1;
                    const srcFl = audioCtx.createBufferSource();
                    srcFl.buffer = bufFl;
                    const filtFl = audioCtx.createBiquadFilter();
                    filtFl.type = 'lowpass';
                    filtFl.frequency.setValueAtTime(basePitch * 1.8, now);
                    const gainFl = audioCtx.createGain();
                    gainFl.gain.setValueAtTime(0.6, now);
                    gainFl.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    srcFl.connect(filtFl);
                    filtFl.connect(gainFl);
                    gainFl.connect(masterGain);
                    srcFl.start(now);
                    break;

                case 'clap': // 👏 拍手聲
                    const bufLenC = audioCtx.sampleRate * 0.15;
                    const bufC = audioCtx.createBuffer(1, bufLenC, audioCtx.sampleRate);
                    const dC = bufC.getChannelData(0);
                    for (let i = 0; i < bufLenC; i++) dC[i] = Math.random() * 2 - 1;
                    const srcC = audioCtx.createBufferSource();
                    srcC.buffer = bufC;
                    const filtC = audioCtx.createBiquadFilter();
                    filtC.type = 'bandpass';
                    filtC.frequency.setValueAtTime(basePitch * 2.5, now);
                    const gainC = audioCtx.createGain();
                    gainC.gain.setValueAtTime(0.8, now);
                    gainC.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    srcC.connect(filtC);
                    filtC.connect(gainC);
                    gainC.connect(masterGain);
                    srcC.start(now);
                    break;

                case 'doorbell': // 🔔 雙音門鈴
                    const oscB = audioCtx.createOscillator();
                    const gainB = audioCtx.createGain();
                    oscB.type = 'sine';
                    oscB.frequency.setValueAtTime(basePitch * 1.2, now);
                    oscB.frequency.setValueAtTime(basePitch * 0.95, now + 0.14);
                    gainB.gain.setValueAtTime(0.7, now);
                    gainB.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                    oscB.connect(gainB);
                    gainB.connect(masterGain);
                    oscB.start(now);
                    oscB.stop(now + 0.45);
                    break;

                case 'paper': // 📄 紙張撕裂聲
                    const bLenP = audioCtx.sampleRate * 0.14;
                    const bP = audioCtx.createBuffer(1, bLenP, audioCtx.sampleRate);
                    const dP = bP.getChannelData(0);
                    for (let i = 0; i < bLenP; i++) dP[i] = Math.random() * 2 - 1;
                    const sP = audioCtx.createBufferSource();
                    sP.buffer = bP;
                    const fP = audioCtx.createBiquadFilter();
                    fP.type = 'highpass';
                    fP.frequency.setValueAtTime(1300, now);
                    fP.frequency.exponentialRampToValueAtTime(basePitch * 3.2, now + 0.11);
                    const gP = audioCtx.createGain();
                    gP.gain.setValueAtTime(0.7, now);
                    gP.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
                    sP.connect(fP);
                    fP.connect(gP);
                    gP.connect(masterGain);
                    sP.start(now);
                    break;

                case 'cork': // 🍾 軟木塞 Pop 聲
                    const oscCk = audioCtx.createOscillator();
                    const gainCk = audioCtx.createGain();
                    oscCk.type = 'sine';
                    oscCk.frequency.setValueAtTime(130, now);
                    oscCk.frequency.exponentialRampToValueAtTime(basePitch * 2.4, now + 0.05);
                    gainCk.gain.setValueAtTime(0.9, now);
                    gainCk.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
                    oscCk.connect(gainCk);
                    gainCk.connect(masterGain);
                    oscCk.start(now);
                    oscCk.stop(now + 0.07);
                    break;

                case 'coin': // 🪙 硬幣落地叮噹聲
                    const oscCn1 = audioCtx.createOscillator();
                    const oscCn2 = audioCtx.createOscillator();
                    const gainCn = audioCtx.createGain();
                    oscCn1.type = 'sine';
                    oscCn2.type = 'sine';
                    oscCn1.frequency.setValueAtTime(basePitch * 2.9, now);
                    oscCn2.frequency.setValueAtTime(basePitch * 3.5, now);
                    gainCn.gain.setValueAtTime(0.7, now);
                    gainCn.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    oscCn1.connect(gainCn);
                    oscCn2.connect(gainCn);
                    gainCn.connect(masterGain);
                    oscCn1.start(now);
                    oscCn2.start(now);
                    oscCn1.stop(now + 0.35);
                    oscCn2.stop(now + 0.35);
                    break;

                case 'keyboard': // ⌨️ 鍵盤打字聲
                    const oscKb = audioCtx.createOscillator();
                    const gainKb = audioCtx.createGain();
                    oscKb.type = 'square';
                    oscKb.frequency.setValueAtTime(basePitch * 1.9, now);
                    oscKb.frequency.exponentialRampToValueAtTime(220, now + 0.03);
                    gainKb.gain.setValueAtTime(0.7, now);
                    gainKb.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                    oscKb.connect(gainKb);
                    gainKb.connect(masterGain);
                    oscKb.start(now);
                    oscKb.stop(now + 0.04);
                    break;
            }
        }

        // 初始化介面與 DOM 參考（解決所有潛在 null 參考問題）
        function initDOMReferences() {
            const trackHeadersContainer = document.getElementById('track-headers-container');
            const timelineRuler = document.getElementById('timeline-ruler');
            const tracksGridContainer = document.getElementById('tracks-grid-container');

            trackHeadersContainer.innerHTML = `
                <div class="h-8 border-b border-slate-800/80 flex items-center justify-between text-[11px] font-bold text-slate-400 uppercase tracking-wider px-1 flex-shrink-0">
                    <span><i class="fa-solid fa-sliders text-cyan-400 mr-1"></i> 生活音效樂器</span>
                    <span class="text-[10px] text-slate-500">M / S</span>
                </div>
            `;
            timelineRuler.innerHTML = '';
            tracksGridContainer.innerHTML = `
                <div id="playhead-line" class="absolute top-0 bottom-0 w-0.5 bg-gradient-to-b from-cyan-400 via-pink-500 to-cyan-400 z-30 pointer-events-none transition-all duration-75 shadow-[0_0_8px_#00f3ff]" style="left: 0px;"></div>
            `;

            // 1. 生成左側 12 軌樂器控制欄 (Fixed h-10 嚴格對齊)
            TRACK_CONFIGS.forEach((cfg, idx) => {
                const headerCard = document.createElement('div');
                headerCard.className = 'h-10 bg-dark-850/90 rounded-lg px-2.5 flex items-center justify-between border border-slate-800 shadow-sm flex-shrink-0';
                headerCard.innerHTML = `
                    <div class="flex items-center gap-1.5 overflow-hidden">
                        <div class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background-color: ${cfg.color}"></div>
                        <span class="text-xs font-bold text-slate-200 truncate">${cfg.name}</span>
                    </div>
                    <div class="flex items-center gap-1 flex-shrink-0">
                        <button onclick="toggleMute(${idx})" id="btn-mute-${idx}" class="w-5 h-5 rounded text-[10px] font-bold bg-slate-800 text-slate-400 hover:text-white transition-colors">M</button>
                        <button onclick="toggleSolo(${idx})" id="btn-solo-${idx}" class="w-5 h-5 rounded text-[10px] font-bold bg-slate-800 text-slate-400 hover:text-white transition-colors">S</button>
                    </div>
                `;
                trackHeadersContainer.appendChild(headerCard);
            });

            // 2. 生成頂部時間軸 (Ruler Scale)
            for (let step = 0; step < totalSteps; step++) {
                const rulerStep = document.createElement('div');
                rulerStep.className = 'w-7 flex-shrink-0 text-center text-[10px] font-mono text-slate-500 border-r border-slate-800/40';
                if (step % 4 === 0) {
                    rulerStep.classList.add('text-cyan-400', 'font-bold');
                    rulerStep.innerText = `${Math.floor(step / 4) + 1}.1`;
                } else {
                    rulerStep.innerText = '•';
                }
                timelineRuler.appendChild(rulerStep);
            }

            // 3. 生成 12 軌右側音軌矩陣 (Grid Row Fixed h-10 完美對齊)
            TRACK_CONFIGS.forEach((cfg, trackIdx) => {
                const row = document.createElement('div');
                row.className = 'h-10 flex items-center flex-shrink-0 relative';

                for (let step = 0; step < totalSteps; step++) {
                    const isBarGroup = Math.floor(step / 4) % 2 === 0;
                    const cell = document.createElement('div');
                    cell.id = `cell-${trackIdx}-${step}`;
                    cell.className = `w-7 h-8 flex-shrink-0 mx-[0.5px] rounded border transition-all cursor-pointer ${
                        isBarGroup ? 'bg-dark-900 border-slate-800' : 'bg-dark-850 border-slate-800/80'
                    } hover:border-cyan-400/50`;
                    
                    cell.onclick = () => toggleCell(trackIdx, step);
                    row.appendChild(cell);
                }
                tracksGridContainer.appendChild(row);
            });

            // 控制控制面板事件
            const btnPlay = document.getElementById('btn-play');
            if (btnPlay) btnPlay.onclick = togglePlay;

            const btnStop = document.getElementById('btn-stop');
            if (btnStop) btnStop.onclick = stopPlay;

            const inputBpm = document.getElementById('input-bpm');
            if (inputBpm) inputBpm.onchange = (e) => { bpm = parseInt(e.target.value) || 110; };
            
            const selectScale = document.getElementById('select-scale');
            if (selectScale) selectScale.onchange = (e) => { currentScale = e.target.value; };

            const btnRandomAll = document.getElementById('btn-random-all');
            if (btnRandomAll) btnRandomAll.onclick = () => generateRandomPattern();

            // Modal 彈窗控制
            const btnOpenPhotoModal = document.getElementById('btn-open-photo-modal');
            const photoModal = document.getElementById('photo-modal');
            const btnCloseModal = document.getElementById('btn-close-modal');

            if (btnOpenPhotoModal && photoModal) {
                btnOpenPhotoModal.onclick = () => photoModal.classList.remove('hidden');
            }
            if (btnCloseModal && photoModal) {
                btnCloseModal.onclick = () => photoModal.classList.add('hidden');
            }
            
            // 圖片上傳控制
            const dropArea = document.getElementById('drop-area');
            const photoInput = document.getElementById('photo-input');
            if (dropArea && photoInput) {
                dropArea.onclick = () => photoInput.click();
                photoInput.onchange = handlePhotoUpload;
            }

            const btnAnalyzeGenerate = document.getElementById('btn-analyze-generate');
            if (btnAnalyzeGenerate) btnAnalyzeGenerate.onclick = runPhotoMusicGeneration;
        }

        // 切換步數音符狀態
        function toggleCell(trackIdx, step) {
            initAudio();
            gridData[trackIdx][step] = !gridData[trackIdx][step];
            updateCellUI(trackIdx, step);
            if (gridData[trackIdx][step]) playSound(trackIdx);
        }

        function updateCellUI(trackIdx, step) {
            const cell = document.getElementById(`cell-${trackIdx}-${step}`);
            if (!cell) return;
            const isActive = gridData[trackIdx][step];
            const cfg = TRACK_CONFIGS[trackIdx];

            if (isActive) {
                cell.style.backgroundColor = cfg.color;
                cell.style.borderColor = '#ffffff';
                cell.classList.add('step-active');
            } else {
                const isBarGroup = Math.floor(step / 4) % 2 === 0;
                cell.style.backgroundColor = '';
                cell.style.borderColor = '';
                cell.className = `w-7 h-8 flex-shrink-0 mx-[0.5px] rounded border transition-all ${
                    isBarGroup ? 'bg-dark-900 border-slate-800' : 'bg-dark-850 border-slate-800/80'
                } hover:border-cyan-400/50`;
            }
        }

        // Mute / Solo 控制
        function toggleMute(idx) {
            trackMutes[idx] = !trackMutes[idx];
            document.getElementById(`btn-mute-${idx}`).className = `w-5 h-5 rounded text-[10px] font-bold ${trackMutes[idx] ? 'bg-red-500 text-white' : 'bg-slate-800 text-slate-400'}`;
        }

        function toggleSolo(idx) {
            trackSolos[idx] = !trackSolos[idx];
            document.getElementById(`btn-solo-${idx}`).className = `w-5 h-5 rounded text-[10px] font-bold ${trackSolos[idx] ? 'bg-amber-500 text-dark-950' : 'bg-slate-800 text-slate-400'}`;
        }

        // 播放與停止邏輯
        function togglePlay() {
            initAudio();
            if (isPlaying) {
                pausePlay();
            } else {
                startPlay();
            }
        }

        function startPlay() {
            isPlaying = true;
            document.getElementById('btn-play').innerHTML = '<i class="fa-solid fa-pause"></i>';
            document.getElementById('vinyl-record').classList.remove('animate-vinyl-paused');
            document.getElementById('tonearm-svg').classList.add('tonearm-playing');
            document.getElementById('vinyl-status').innerText = 'PLAYING';
            document.getElementById('vinyl-status').className = 'text-[10px] text-cyan-400 font-mono font-bold animate-pulse';

            const interval = (60 / bpm / 4) * 1000;
            timerId = setInterval(() => {
                stepForward();
            }, interval);
        }

        function pausePlay() {
            isPlaying = false;
            document.getElementById('btn-play').innerHTML = '<i class="fa-solid fa-play"></i>';
            document.getElementById('vinyl-record').classList.add('animate-vinyl-paused');
            document.getElementById('tonearm-svg').classList.remove('tonearm-playing');
            document.getElementById('vinyl-status').innerText = 'PAUSED';
            document.getElementById('vinyl-status').className = 'text-[10px] text-slate-500 font-mono';
            clearInterval(timerId);
        }

        function stopPlay() {
            pausePlay();
            currentStep = 0;
            updatePlayheadUI();
        }

        function stepForward() {
            for (let t = 0; t < 12; t++) {
                if (gridData[t][currentStep]) {
                    playSound(t);
                }
            }
            updatePlayheadUI();
            currentStep = (currentStep + 1) % totalSteps;
        }

        function updatePlayheadUI() {
            const playhead = document.getElementById('playhead-line');
            if (!playhead) return;
            const leftOffset = currentStep * 29 + 14;
            playhead.style.left = `${leftOffset}px`;
        }

        // 音樂風格與隨機樂律生成算法
        function generateRandomPattern() {
            gridData = Array(12).fill(null).map(() => Array(totalSteps).fill(false));

            const styleType = Math.floor(Math.random() * 4); 

            for (let s = 0; s < totalSteps; s++) {
                const isDownBeat = s % 4 === 0;
                const isOffBeat = s % 2 === 1;
                const isSixteenth = s % 1 === 0;

                if (isDownBeat) {
                    if (s % 8 === 0) gridData[1][s] = true; // 關門重音
                    if (s % 8 === 4) gridData[6][s] = true; // 拍手擊掌
                }

                if (styleType === 0) {
                    if (isOffBeat && Math.random() < 0.6) gridData[2][s] = true;  
                    if (s % 4 === 2 && Math.random() < 0.7) gridData[3][s] = true; 
                    if (Math.random() < 0.18) gridData[10][s] = true;             
                    if (Math.random() < 0.15) gridData[11][s] = true;             
                } else if (styleType === 1) {
                    if (Math.random() < 0.18) gridData[4][s] = true;              
                    if (Math.random() < 0.12) gridData[0][s] = true;              
                    if (Math.random() < 0.1) gridData[7][s] = true;               
                    if (Math.random() < 0.2) gridData[8][s] = true;               
                } else if (styleType === 2) {
                    if (isSixteenth && Math.random() < 0.35) gridData[9][s] = true;
                    if (isOffBeat && Math.random() < 0.4) gridData[11][s] = true;  
                    if (s % 8 === 2 || s % 8 === 6) gridData[3][s] = Math.random() < 0.8; 
                    if (Math.random() < 0.2) gridData[10][s] = true;              
                } else {
                    for (let t = 0; t < 12; t++) {
                        const prob = (t === 1 || t === 6) ? 0.2 : 0.1;
                        if (Math.random() < prob) gridData[t][s] = true;
                    }
                }
            }

            for (let t = 0; t < 12; t++) {
                for (let s = 0; s < totalSteps; s++) {
                    updateCellUI(t, s);
                }
            }
        }

        // 圖片上傳處理
        function handlePhotoUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                uploadedImageBase64 = event.target.result;
                document.getElementById('photo-preview').src = uploadedImageBase64;
                document.getElementById('photo-filename').innerText = file.name;
                document.getElementById('photo-preview-container').classList.remove('hidden');
                
                document.getElementById('vinyl-cover').style.backgroundImage = `url(${uploadedImageBase64})`;
                document.getElementById('bg-canvas-container').style.backgroundImage = `url(${uploadedImageBase64})`;
            };
            reader.readAsDataURL(file);
        }

        // 圖片配樂分析與自動生成樂曲
        function runPhotoMusicGeneration() {
            generateRandomPattern();

            document.getElementById('photo-modal').classList.add('hidden');
            if (!isPlaying) togglePlay();
        }

        // DOM 載入完畢後進行初始化
        window.addEventListener('DOMContentLoaded', () => {
            initDOMReferences();
        });
    </script>
</body>
